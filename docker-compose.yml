version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FIRESTORE_PROJECT_ID=your_project_id
      - FIREBASE_API_KEY=your_api_key
      - FCM_SERVER_KEY=your_fcm_server_key
    volumes:
      - ./backend:/app
    depends_on:
      - firestore

  firestore:
    image: google/cloud-sdk:latest
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - firestore_data:/data

  frontend:
    build:
      context: ./frontend/pulse-connect-ui-main
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/pulse-connect-ui-main:/app

volumes:
  firestore_data: